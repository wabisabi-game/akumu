<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="悪夢">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <!-- ストーリーの書体：ロシア語は PT Serif、日本語の字幕はペン書きのような Klee One（どちらも SIL Open Font License） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=PT+Serif:ital@0;1&display=swap">
    <title>悪夢</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; overscroll-behavior: none;
                   -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: none; outline: none; }
      /* スマホを縦に持っているときは、画面全体を 90 度回して横表示にする（スマホを横にすればそのまま遊べる） */
      @media (orientation: portrait) and (pointer: coarse) {
        #stage { inset: auto; top: 0; left: 100vw; width: 100vh; height: 100vw; transform: rotate(90deg); transform-origin: 0 0; }
        @supports (height: 100dvh) { #stage { width: 100dvh; left: 100dvw; height: 100dvw; } }
      }
      .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #c9c2b8; font: 18px "Hiragino Sans", "Yu Gothic", sans-serif; background: #000; text-align: center; }
      #loading-bar { width: min(60vw, 420px); height: 4px; margin-top: 18px; background: #222; border-radius: 2px; overflow: hidden; }
      #loading-fill { width: 0; height: 100%; background: #8a7a62; }
      /* 最初のタイトル。どこをタップしても始まる */
      #title { z-index: 16; cursor: pointer; background: #000; }
      #title h1 { margin: 0; font: clamp(48px, 9vmax, 84px) "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; font-weight: normal;
                  letter-spacing: 0.4em; text-indent: 0.4em; color: #e8e0d4; }
      #title .hint { margin-top: 36px; font-size: 14px; letter-spacing: 0.2em; color: #6e655a; }
      #warning { display: none; position: fixed; top: 12%; left: 8%; right: 8%; padding: 16px; color: #fff; background: #542d31; font: 16px sans-serif; }
      /* 最初に流すストーリー。タップ（クリック）で次の場面へ進む */
      #story { display: none; z-index: 15; cursor: pointer; padding: 24px 8%; box-sizing: border-box;
               font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif; }
      /* 映画のように：ロシア語の語りを画面の中ほどに、日本語の字幕を下に出す */
      #story-ru { max-width: 860px; margin-bottom: 14vh; font: italic clamp(15px, 2.3vmax, 26px) / 1.65 "PT Serif", Georgia, serif;
                  color: #b9b0a3; white-space: pre-line; opacity: 0; transition: opacity 1.1s; }
      #story-ja { position: absolute; left: 4%; right: 4%; bottom: 11%; font: 600 clamp(15px, 2.2vmax, 25px) / 1.55 "Klee One", "Hiragino Mincho ProN", serif;
                  color: #fff; letter-spacing: 0.06em; white-space: pre-line; opacity: 0; transition: opacity 0.6s 0.35s;
                  text-shadow: 0 0 3px #000, 0 0 3px #000, 1px 1px 2px #000; }
      #story-ru.shown, #story-ja.shown { opacity: 1; }
      #story-next { position: absolute; bottom: 3%; font-size: 13px; color: #6e655a; animation: blink 2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      #story-skip { position: absolute; top: 14px; right: 14px; padding: 6px 14px; border: 1px solid #4a443c; border-radius: 4px;
                    background: transparent; color: #8a8178; font: 13px sans-serif; }
      /* スマホで最初に出す案内：①横向きにする ②ホーム画面に追加する */
      .guide { display: none; z-index: 20; padding: 16px 24px; box-sizing: border-box; background: #000; }
      .guide h2 { margin: 0 0 10px; font-size: 21px; color: #e8e0d4; letter-spacing: 0.05em; }
      .guide p { margin: 4px 0; font-size: 15px; line-height: 1.5; }
      .guide .note { font-size: 13px; color: #8a8178; }
      .guide ol { margin: 8px 0 4px; padding-left: 1.6em; text-align: left; font-size: 15px; line-height: 1.6; }
      .guide b { color: #e8e0d4; }
      .guide .buttons { display: flex; gap: 14px; margin-top: 14px; }
      .guide button { padding: 10px 26px; border: 1px solid #6e655a; border-radius: 6px; background: #2a2622; color: #e8e0d4;
                      font: 16px "Hiragino Sans", "Yu Gothic", sans-serif; }
      .guide button.primary { background: #8a7a62; border-color: #8a7a62; color: #111; font-weight: bold; }
      .guide .phone { width: 40px; height: 70px; border: 3px solid #c9c2b8; border-radius: 8px; margin-bottom: 16px; animation: turn 2.2s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      .share { display: inline-block; width: 13px; height: 12px; border: 2px solid #c9c2b8; border-top: 0; position: relative; margin: 0 3px; vertical-align: -1px; }
      .share::before { content: ""; position: absolute; left: 50%; top: -7px; width: 2px; height: 12px; margin-left: -1px; background: #c9c2b8; }
      #fullscreen { position: fixed; right: 12px; bottom: 12px; padding: 6px 12px; border: 0; border-radius: 4px;
                    background: rgba(60, 55, 50, 0.6); color: #ddd; font: 13px sans-serif; cursor: pointer; display: none; }
    </style>
  </head>
  <body>
    <div id="stage">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
    <div id="loading" class="overlay">
      <div>読み込み中…</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>
    <div id="title" class="overlay">
      <h1>悪夢</h1>
      <p class="hint">ヘッドホン推奨</p>
    </div>
    <div id="story" class="overlay">
      <div id="story-ru" lang="ru"></div>
      <div id="story-ja"></div>
      <div id="story-next">タップで次へ</div>
      <button id="story-skip" type="button">スキップ</button>
    </div>
    <div id="warning" role="alert"></div>
    <button id="fullscreen" type="button">全画面</button>
    <div id="guide-home" class="overlay guide">
      <h2>ホーム画面に追加しよう</h2>
      <p>ホーム画面から開くと、アプリのように全画面で遊べます</p>
      <ol id="home-steps"></ol>
      <div class="buttons">
        <button id="install" class="primary" type="button" style="display: none">ホーム画面に追加</button>
        <button id="home-later" type="button">あとで</button>
      </div>
    </div>
    </div>
    <!-- 横向きの案内は、縦に持っていても読めるように画面の向きのまま出す -->
    <div id="guide-rotate" class="overlay guide">
      <div class="phone"></div>
      <h2>スマホを横向きにしてください</h2>
      <p>横向きに持って遊ぶゲームです</p>
      <p class="note">縦のままでも、画面は横向きに表示されます</p>
      <div class="buttons"><button id="rotate-next" class="primary" type="button">次へ</button></div>
    </div>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const title = document.querySelector("#title");
      const fullscreen = document.querySelector("#fullscreen");
      const touch = matchMedia("(pointer: coarse)").matches;
      if (!touch) document.querySelector("#story-next").textContent = "クリックで次へ";

      // ストーリー：[ロシア語の語り, 日本語の字幕]（| で改行）。タイトルの後、読み込みのあいだに音楽と一緒に流し、終わるかスキップするとゲームが始まる
      const story = [
        ["Я живу бильярдом.|Проигрывать мне нельзя.",
         "俺はビリヤードで食っている。|負けは許されない。"],
        ["Моего пса звали Хаку.|Старый борзой, почти слепой.|Он жил на слух: стук шаров, мои шаги.",
         "相棒はハク。年老いたボルゾイで、|ほとんど目が見えなかった。|玉の音と俺の足音だけを頼りに生きていた。"],
        ["Той зимой ко мне пришли люди.|Я был должен им слишком много.",
         "あの冬、男たちが部屋に来た。|借りが大きすぎた。"],
        ["Последняя надежда —|подпольная игра на деньги в Ростове.",
         "最後の望みは、|ロストフの地下の賭け試合だった。"],
        ["Соседям Хаку не оставишь — он воет.|Я запер его в бильярдной|и насыпал корма на три дня.",
         "隣には預けられない。あいつは吠える。|俺はハクをビリヤード部屋に閉じ込め、|三日分の餌を盛った。"],
        ["Игра шла девять дней.|На четвёртый позвонила соседка:|«Ваша собака воет всю ночь и скребёт дверь».|Я выключил телефон.",
         "試合は九日続いた。|四日目、隣の女から電話が来た。|「お宅の犬が一晩中鳴いて、ドアをひっかいてる」|俺は電話の電源を切った。"],
        ["Я вернулся ночью.|Дверь изнутри изодрана когтями.|На полу — бурые полосы.|Миска вылизана до крови.",
         "夜に帰った。|ドアの内側は爪でずたずただった。|床には茶色い筋。|皿は、血が出るまでなめ尽くされていた。"],
        ["Хаку лежал у ножки стола.|Передней лапы не было до локтя.|Он съел её сам.",
         "ハクは台の脚のそばで死んでいた。|前足が、肘から先なかった。|自分で食べたのだ。"],
        ["В желудке нашёлся шар. Белый биток.|Единственное в комнате,|что пахло моими руками.",
         "胃の中から玉がひとつ出てきた。白い手球。|部屋の中でただひとつ、|俺の手の匂いがするもの。"],
        ["Мне было жаль. Но выбора не было.|Без той победы мы оба|замёрзли бы на улице.",
         "すまないと思った。だが、選べなかった。|あの勝ちがなければ、|俺たちは二人とも路上で凍えていた。"],
        ["Я выточил из его костей новый биток.|На удачу.|Наутро я не промахнулся ни разу.",
         "俺はあいつの骨を削り、新しい手球を作った。|お守りのつもりだった。|翌朝の試合、俺は一度も外さなかった。"],
        ["Той ночью я открыл глаза на сукне.|Белым шаром.|Из его костей.",
         "その夜、目を開けると、俺は羅紗の上にいた。|白い玉として。|あいつの骨で、できた。"],
        ["За бортом что-то волочится по полу.|Три лапы. Мутные белые глаза.|Он помнит запах своих костей.",
         "台の外で、何かが床を引きずっている。|三本の足。白く濁った目。|あいつは、自分の骨の匂いを覚えている。"],
        ["Чтобы проснуться, загони все шары в лузы|и упади последним.|Не шуми. Теперь есть будет он.",
         "目を覚ますには、すべての玉をポケットに落とし、|最後に自分が落ちること。|音を立てるな。今度は、あいつが食べる番だ。"],
      ];
      const storyBox = document.querySelector("#story");
      const storyRu = document.querySelector("#story-ru"), storyJa = document.querySelector("#story-ja");
      let storyPage = -1, storyTimer = 0;
      function nextStory() {
        storyPage++;
        if (storyPage >= story.length) { endStory(); return; }
        storyRu.classList.remove("shown");
        storyJa.classList.remove("shown");
        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => {
          const lines = text => text.split("|").join(String.fromCharCode(10));   // | は改行（テンプレートの書き出しで改行記号が壊れるため）
          storyRu.textContent = lines(story[storyPage][0]);
          storyJa.textContent = lines(story[storyPage][1]);
          storyRu.classList.add("shown");
          storyJa.classList.add("shown");
        }, storyPage === 0 ? 0 : 450);
      }
      storyBox.onclick = nextStory;
      document.querySelector("#story-skip").onclick = e => { e.stopPropagation(); endStory(); };

      // 悪夢の音楽：1908 年のレコード「Hearts and Flowers」（パブリックドメイン、針音を取り除いたもの）を無限にループする。
      // ストーリーから流れ続け、ゲームでは少し控えめにし、悪夢から覚めたとき（脱出）にフェードアウトして止める。次の夜でまた流れる。
      // iPhone の Safari は音声の音量を変えられないので、Web Audio で鳴らす（読み込みはページを開いたときに始めておく）
      const music = (() => {
        let ctx = null, gain = null, src = null, decoded = null;
        const data = fetch("story-music.mp3").then(r => r.arrayBuffer()).catch(e => { console.warn(e); return null; });
        function ramp(volume, seconds) {
          const t = ctx.currentTime;
          gain.gain.cancelScheduledValues(t);
          gain.gain.setValueAtTime(gain.gain.value, t);
          gain.gain.linearRampToValueAtTime(volume, t + seconds);
        }
        // タップの中で最初に呼ぶ（ブラウザは操作があるまで音を出させない）
        function play(volume, seconds) {
          if (!ctx) {
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
            gain = ctx.createGain();
            gain.gain.value = 0;
            gain.connect(ctx.destination);
          }
          if (ctx.state === "suspended") ctx.resume();   // タップの中で作っても止まった状態で始まるブラウザがある
          (decoded ? Promise.resolve(decoded) : data.then(buf => buf && ctx.decodeAudioData(buf.slice(0)))).then(d => {
            if (!d) return;
            decoded = d;
            if (!src) {
              src = ctx.createBufferSource();
              src.buffer = d;
              src.loop = true;
              src.connect(gain);
              src.start();
            }
            ramp(volume, seconds);
          }).catch(e => console.warn(e));
        }
        function stop(seconds) {
          if (!ctx || !src) return;
          ramp(0, seconds);
          src.stop(ctx.currentTime + seconds + 0.05);
          src = null;
        }
        return { play, stop };
      })();
      const StoryVolume = 0.9, GameVolume = 0.45;
      // ゲームから呼ばれる（夜が始まると true、悪夢から覚めると false）
      window.nightmareMusic = on => on ? music.play(GameVolume, 2) : music.stop(3);

      // 流れ：タイトル → （タップで）音楽とストーリー → ゲーム。読み込みが間に合わなければ、読み込みの表示を出して待つ
      let unity = null, storyDone = false, begun = false;
      title.onclick = () => {
        title.style.display = "none";
        // スマホでは全画面にして横向きに固定する（できないブラウザでは何もしない）
        if (touch && !installed) {
          const request = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
          if (request) Promise.resolve(request.call(document.documentElement))
            .then(() => screen.orientation && screen.orientation.lock ? screen.orientation.lock("landscape") : null)
            .catch(e => console.warn(e));
        }
        music.play(StoryVolume, 2);
        storyBox.style.display = "flex";
        nextStory();
      };
      function endStory() {
        if (storyDone) return;
        storyDone = true;
        storyBox.style.display = "none";
        if (unity) beginGame();
      }
      // ゲームの音（犬・心音など）は、ここで初めて鳴り始める
      function beginGame() {
        if (begun) return;
        begun = true;
        loading.style.display = "none";
        canvas.focus();
        unity.SendMessage("GameManager", "BeginPlay");
        fullscreen.style.display = (document.fullscreenEnabled || document.webkitFullscreenEnabled) ? "block" : "none";
      }

      // ホーム画面から開いたとき（アプリとして動いているとき）は、案内も全画面化もいらない
      const installed = matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches
        || navigator.standalone === true;
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(e => console.warn(e));

      // スマホでは最初に「横向きにして」→「ホーム画面に追加して」の順に案内する
      const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const guideRotate = document.querySelector("#guide-rotate"), guideHome = document.querySelector("#guide-home");
      const install = document.querySelector("#install");
      let installPrompt = null;
      document.querySelector("#home-steps").innerHTML = ios
        ? "<li>Safari の画面下（iPad は上）にある共有ボタン <span class='share'></span> をタップ</li>"
          + "<li>メニューを下へずらして <b>「ホーム画面に追加」</b> をタップ</li>"
          + "<li>右上の <b>「追加」</b> をタップ</li>"
        : "<li>ブラウザ右上の <b>「⋮」</b>（メニュー）をタップ</li>"
          + "<li><b>「ホーム画面に追加」</b> または <b>「アプリをインストール」</b> をタップ</li>"
          + "<li><b>「インストール」</b>（または「追加」）をタップ</li>";
      // Android の Chrome などでは、ボタン 1 つで追加の確認を出せる
      window.addEventListener("beforeinstallprompt", e => {
        e.preventDefault();
        installPrompt = e;
        install.style.display = "inline-block";
      });
      install.onclick = () => {
        if (!installPrompt) return;
        installPrompt.prompt();
        installPrompt.userChoice.finally(() => { installPrompt = null; install.style.display = "none"; guideHome.style.display = "none"; });
      };
      window.addEventListener("appinstalled", () => { guideHome.style.display = "none"; });
      if (touch && !installed) {
        guideRotate.style.display = "flex";
        // itch.io などのページに埋め込まれているときは、ホーム画面に追加してもアプリにならないので案内しない
        const embedded = window.self !== window.top;
        document.querySelector("#rotate-next").onclick = () => { guideRotate.style.display = "none"; if (!embedded) guideHome.style.display = "flex"; };
        document.querySelector("#home-later").onclick = () => { guideHome.style.display = "none"; };
      }

      // 画面を回して横表示にしている間は、タッチやマウスの位置も回した画面の座標に直してから Unity に渡す
      const stage = document.querySelector("#stage");
      const portrait = matchMedia("(orientation: portrait) and (pointer: coarse)");
      const nativeRect = Element.prototype.getBoundingClientRect;
      canvas.getBoundingClientRect = function () {
        if (!portrait.matches) return nativeRect.call(this);
        const w = this.clientWidth, h = this.clientHeight;
        return { left: 0, top: 0, x: 0, y: 0, right: w, bottom: h, width: w, height: h };
      };
      function getter(proto, name) { return Object.getOwnPropertyDescriptor(proto, name).get; }
      function turned(cx, cy) {
        const r = nativeRect.call(stage);
        return [cy - r.top, r.right - cx];
      }
      function rotatePoint(target, proto) {
        const [x, y] = turned(getter(proto, "clientX").call(target), getter(proto, "clientY").call(target));
        for (const [name, value] of [["clientX", x], ["clientY", y], ["pageX", x], ["pageY", y], ["screenX", x], ["screenY", y]])
          Object.defineProperty(target, name, { value: value, configurable: true });
      }
      // タッチは 1 つずつの座標を書き換えても Safari（WebKit）では効かないので、一覧ごと回した座標の写しに差し替える
      function turnedTouches(list) {
        const copy = [];
        for (let i = 0; i < list.length; i++) {
          const t = list[i], [x, y] = turned(t.clientX, t.clientY);
          copy.push({ identifier: t.identifier, target: t.target, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y,
                      radiusX: t.radiusX, radiusY: t.radiusY, rotationAngle: t.rotationAngle, force: t.force });
        }
        copy.item = i => copy[i] || null;
        return copy;
      }
      function rotateEvent(e) {
        if (!portrait.matches || !stage.contains(e.target)) return;
        if (window.TouchEvent && e instanceof TouchEvent) {
          for (const name of ["touches", "changedTouches", "targetTouches"])
            Object.defineProperty(e, name, { value: turnedTouches(e[name]), configurable: true });
        } else if (e instanceof MouseEvent) {
          rotatePoint(e, MouseEvent.prototype);
        }
      }
      for (const type of ["touchstart", "touchmove", "touchend", "touchcancel", "mousedown", "mousemove", "mouseup",
                          "pointerdown", "pointermove", "pointerup", "pointercancel", "click", "wheel"])
        window.addEventListener(type, rotateEvent, { capture: true, passive: true });

      function showBanner(message, type) {
        if (type !== "error") { console.warn(message); return; }
        console.error(message);
        loading.style.display = "none";
        const warning = document.querySelector("#warning");
        warning.textContent = "起動できませんでした。ページを再読み込みしてください。";
        warning.style.display = "block";
      }

      function toggleFullscreen() {
        const active = document.fullscreenElement || document.webkitFullscreenElement;
        const action = active ? (document.exitFullscreen || document.webkitExitFullscreen)
          : (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
        if (action) Promise.resolve(action.call(active ? document : document.documentElement)).catch(e => console.warn(e));
      }
      document.addEventListener("fullscreenchange", () => {
        fullscreen.textContent = document.fullscreenElement ? "全画面を終了" : "全画面";
      });

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "OldDog",
        productVersion: "1.0",
        showBanner: showBanner
      };
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);   // 画質優先。3 倍の画面でも 2 倍までにして重くなりすぎないようにする

      const loader = document.createElement("script");
      loader.src = buildUrl + "/Web.loader.js";
      loader.onerror = () => showBanner("Could not load Unity loader", "error");
      loader.onload = () => {
        createUnityInstance(canvas, config, progress => {
          document.querySelector("#loading-fill").style.width = Math.round(progress * 100) + "%";
        }).then(instance => {
          unity = instance;
          fullscreen.onclick = toggleFullscreen;
          if (storyDone) beginGame();
        }).catch(message => showBanner(message, "error"));
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
